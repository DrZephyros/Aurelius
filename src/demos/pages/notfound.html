<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — Lost in the dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ── tweak me ─────────────────────────────── */
  :root { --bg: #05060a; --fg: #f1ede4; --muted: #8c8f99; --line: rgba(255,255,255,.12); --accent: #ffd9a0; --serif: 'Instrument Serif', Georgia, serif; --sans: 'Geist', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace; --ease: cubic-bezier(.16,1,.3,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; cursor: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
  .code { font: italic 400 clamp(8rem, 30vw, 24rem)/.8 var(--serif); letter-spacing: -.04em; color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,.55); }
  .copy { position: absolute; left: 50%; bottom: 14vh; transform: translateX(-50%); width: min(560px, 90vw); }
  .eyebrow { font: 500 11px var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--accent); }
  h1 { font: 400 clamp(2rem, 5vw, 3.6rem)/1 var(--serif); margin-top: 14px; letter-spacing: -.02em; }
  h1 em { color: var(--accent); }
  p { color: #b9b7b0; margin-top: 12px; font-size: 15.5px; line-height: 1.55; }
  /* the darkness: a soft hole that follows your light */
  .veil { position: fixed; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(circle var(--r, 240px) at var(--mx, 50%) var(--my, 50%), transparent 0, rgba(5,6,10,.3) 38%, rgba(5,6,10,.8) 100%); }
  .ui { position: fixed; z-index: 8; left: 0; right: 0; bottom: 0; padding: 22px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .top { position: fixed; z-index: 8; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 22px 28px; font: 500 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .btn { cursor: pointer; border: 1px solid var(--line); background: rgba(255,255,255,.06); backdrop-filter: blur(12px); color: var(--fg); font: 500 14px var(--sans); height: 46px; padding: 0 22px; border-radius: 99px; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; transition: .5s var(--ease); }
  .btn:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.4); }
  .btn.p { background: var(--accent); color: #1a1208; border-color: transparent; font-weight: 600; }
  .btn.p:hover { box-shadow: 0 10px 40px -8px rgba(255,217,160,.6); }
  .search { position: relative; }
  .search input { cursor: text; height: 46px; width: min(300px, 80vw); border-radius: 99px; border: 1px solid var(--line); background: rgba(255,255,255,.06); backdrop-filter: blur(12px); color: var(--fg); font: 400 14px var(--sans); padding: 0 20px; outline: none; transition: border-color .3s; }
  .search input:focus { border-color: var(--accent); }
  .sug { position: absolute; bottom: 54px; left: 0; right: 0; background: rgba(14,15,20,.94); border: 1px solid var(--line); border-radius: 18px; padding: 6px; display: none; text-align: left; backdrop-filter: blur(16px); }
  .sug.on { display: block; }
  .sug a { cursor: pointer; display: flex; justify-content: space-between; padding: 10px 14px; border-radius: 12px; font-size: 14px; color: var(--fg); text-decoration: none; }
  .sug a span { color: var(--muted); font: 12px var(--mono); }
  .sug a.sel, .sug a:hover { background: rgba(255,255,255,.08); }
  .torch { position: fixed; z-index: 9; left: 0; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 24px 8px rgba(255,217,160,.7); pointer-events: none; transition: transform .25s var(--ease); }
  .hint { position: fixed; z-index: 8; top: 50%; left: 50%; transform: translate(-50%, 150px); font: 500 11px var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); transition: opacity .8s; }
  @media (max-width: 640px) { .copy { bottom: 24vh; } .top span:last-child { display: none; } body { cursor: auto; } .torch { display: none; } }
  @media (hover: none) { body { cursor: auto; } .torch { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><span>Aurelius</span><span>Error 404 · /this-page-went-out</span></div>
<div class="stage">
  <div class="code" aria-hidden="true">404</div>
  <div class="copy">
    <div class="eyebrow">Page not found</div>
    <h1>It's dark in here. <em>Find the light.</em></h1>
    <p>The page you wanted has moved, vanished or never existed. Move your light around — or just pick a way out below.</p>
  </div>
</div>
<div class="veil" id="veil"></div>
<div class="hint" id="hint">Move your cursor · click to widen the beam</div>
<div class="ui">
  <a class="btn p" href="#" id="home">← Take me home</a>
  <div class="search">
    <input id="q" placeholder="Search for a page…" autocomplete="off" aria-label="Search pages" />
    <div class="sug" id="sug" role="listbox"></div>
  </div>
  <a class="btn" href="#" onclick="history.back();return false">Go back</a>
</div>
<div class="torch" id="torch"></div>
<script>
(() => {
  const veil = document.getElementById('veil'), torch = document.getElementById('torch'), hint = document.getElementById('hint');
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W, H, dpr = Math.min(2, devicePixelRatio || 1);
  const size = () => { W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  addEventListener('resize', size); size();

  let tx = W / 2, ty = H / 2, x = tx, y = ty, r = 230, tr = 230, user = false;
  const move = (e) => { user = true; tx = e.clientX; ty = e.clientY; hint.style.opacity = 0; };
  addEventListener('pointermove', move);
  addEventListener('pointerdown', (e) => { move(e); tr = 420; torch.style.transform = 'scale(1.8)'; });
  addEventListener('pointerup', () => { tr = 230; torch.style.transform = ''; });
  addEventListener('keydown', (e) => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') return; });

  // fireflies that drift and are drawn toward the light
  const flies = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0, ph: Math.random() * 6.28, s: .6 + Math.random() * 1.6 }));
  let t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000;
    if (!user) { tx = W / 2 + Math.sin(t * .7) * W * .28; ty = H / 2 + Math.sin(t * 1.1 + 1) * H * .18; }
    x += (tx - x) * .09; y += (ty - y) * .09; r += (tr - r) * .07;
    veil.style.setProperty('--mx', x + 'px'); veil.style.setProperty('--my', y + 'px'); veil.style.setProperty('--r', r + 'px');
    torch.style.left = x + 'px'; torch.style.top = y + 'px';
    ctx.clearRect(0, 0, W, H);
    for (const f of flies) {
      const dx = x - f.x, dy = y - f.y, d = Math.hypot(dx, dy) + 1;
      f.vx += (Math.cos(t * .8 + f.ph) * .05) + (d < 420 ? dx / d * .035 : 0);
      f.vy += (Math.sin(t * .9 + f.ph) * .05) + (d < 420 ? dy / d * .035 : 0);
      f.vx *= .975; f.vy *= .975; f.x += f.vx; f.y += f.vy;
      if (f.x < -20) f.x = W + 20; if (f.x > W + 20) f.x = -20; if (f.y < -20) f.y = H + 20; if (f.y > H + 20) f.y = -20;
      const vis = Math.max(.08, 1 - d / (r * 1.25));
      const a = vis * (.55 + .45 * Math.sin(t * 2 + f.ph));
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 10 * f.s);
      g.addColorStop(0, `rgba(255,226,170,${a})`); g.addColorStop(1, 'rgba(255,226,170,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, 10 * f.s, 0, 6.28); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // search with suggestions
  const PAGES = [['Home', '/'], ['Pricing', '/pricing'], ['Dashboard', '/app'], ['Sign in', '/signin'], ['Documentation', '/docs'], ['Contact support', '/support'], ['Status', '/status'], ['Changelog', '/changelog']];
  const q = document.getElementById('q'), sug = document.getElementById('sug'); let sel = 0, list = [];
  const render = () => {
    list = PAGES.filter(p => p[0].toLowerCase().includes(q.value.trim().toLowerCase())).slice(0, 5);
    sug.innerHTML = list.map((p, i) => `<a class="${i === sel ? 'sel' : ''}" role="option">${p[0]}<span>${p[1]}</span></a>`).join('');
    sug.classList.toggle('on', q.value.trim().length > 0 && list.length > 0);
  };
  q.addEventListener('input', () => { sel = 0; render(); });
  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { sel = (sel + 1) % Math.max(1, list.length); render(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { sel = (sel - 1 + list.length) % Math.max(1, list.length); render(); e.preventDefault(); }
    if (e.key === 'Enter' && list[sel]) { q.value = list[sel][0]; sug.classList.remove('on'); }
  });
  sug.addEventListener('click', (e) => { const a = e.target.closest('a'); if (a) { q.value = a.firstChild.textContent; sug.classList.remove('on'); } });
  document.getElementById('home').addEventListener('click', (e) => e.preventDefault());
})();
</script>
</body>
</html>
