<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Lumen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  /* ── tweak me ─────────────────────────────── */
  :root {
    --bg: #0d0b14; --panel: #151221; --fg: #f4f1ee; --muted: #9a94ad; --line: rgba(255,255,255,.1);
    --accent: #ffb454; --accent-ink: #1b1204; --danger: #ff6b7a; --ok: #5ee0a0;
    --serif: 'Instrument Serif', Georgia, serif; --sans: 'Inter', system-ui, sans-serif;
    --ease: cubic-bezier(.16,1,.3,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--sans); background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; }
  .shell { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); min-height: 100%; padding: 14px; gap: 14px; }
  .left { display: flex; flex-direction: column; padding: 18px 28px 22px; }
  .logo { display: flex; align-items: center; gap: 10px; font: 600 17px var(--sans); letter-spacing: -.02em; }
  .logo i { width: 22px; height: 22px; border-radius: 7px; background: conic-gradient(from 200deg, var(--accent), #ff6a3d, var(--accent)); box-shadow: 0 0 24px -4px var(--accent); }
  .center { flex: 1; display: grid; place-items: center; }
  .card { width: min(400px, 100%); }
  h1 { font: 400 clamp(2.4rem, 4vw, 3.4rem)/1 var(--serif); letter-spacing: -.02em; }
  h1 em { color: var(--accent); }
  .sub { color: var(--muted); margin-top: 12px; font-size: 15px; }
  .socials { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 30px; }
  .soc { display: flex; align-items: center; justify-content: center; gap: 10px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--fg); font: 500 14px var(--sans); cursor: pointer; transition: background .3s, border-color .3s, transform .5s var(--ease); }
  .soc:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.22); transform: translateY(-2px); }
  .soc svg { width: 18px; height: 18px; }
  .or { display: flex; align-items: center; gap: 14px; margin: 24px 0; color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .field { position: relative; margin-bottom: 16px; }
  .field input { width: 100%; height: 58px; padding: 22px 48px 6px 16px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.035); color: var(--fg); font: 400 15px var(--sans); outline: none; transition: border-color .3s, box-shadow .3s, background .3s; }
  .field label { position: absolute; left: 17px; top: 19px; font-size: 15px; color: var(--muted); pointer-events: none; transition: all .3s var(--ease); transform-origin: left; }
  .field input:focus, .field input:not(:placeholder-shown) { background: rgba(255,255,255,.05); }
  .field input:focus + label, .field input:not(:placeholder-shown) + label { transform: translateY(-11px) scale(.76); color: var(--accent); }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,180,84,.15); }
  .field.bad input { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(255,107,122,.12); }
  .field.good input { border-color: rgba(94,224,160,.5); }
  .field .ic { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; display: grid; place-items: center; border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 8px; }
  .field .ic:hover { color: var(--fg); background: rgba(255,255,255,.07); }
  .field .ic svg { width: 18px; height: 18px; }
  .field .tick { color: var(--ok); opacity: 0; transform: scale(.5); transition: .4s var(--ease); pointer-events: none; }
  .field.good .tick { opacity: 1; transform: none; }
  .hint { min-height: 18px; margin: -8px 0 8px 4px; font-size: 12.5px; color: var(--danger); display: flex; align-items: center; gap: 6px; }
  .hint.warn { color: var(--accent); }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 22px; font-size: 14px; }
  .check { display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--muted); user-select: none; }
  .check input { appearance: none; width: 20px; height: 20px; border-radius: 6px; border: 1px solid rgba(255,255,255,.25); display: grid; place-items: center; cursor: pointer; transition: .25s; }
  .check input:checked { background: var(--accent); border-color: var(--accent); }
  .check input:checked::after { content: ''; width: 9px; height: 5px; border: solid var(--accent-ink); border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px,-1px); }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; text-underline-offset: 4px; }
  .submit { width: 100%; height: 54px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font: 600 15px var(--sans); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; position: relative; overflow: hidden; transition: transform .5s var(--ease), box-shadow .5s var(--ease); }
  .submit:hover { transform: translateY(-2px); box-shadow: 0 16px 40px -14px var(--accent); }
  .submit:active { transform: scale(.985); }
  .submit .spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(27,18,4,.3); border-top-color: var(--accent-ink); animation: spin .7s linear infinite; display: none; }
  .submit.loading .spin { display: block; } .submit.loading .lbl { opacity: .7; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .foot { text-align: center; margin-top: 26px; color: var(--muted); font-size: 14px; }
  .demo { margin-top: 18px; text-align: center; font-size: 12px; color: #6f6a82; }
  .shake { animation: shake .5s; } @keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
  .ok-state { text-align: center; display: none; }
  .ok-state.show { display: block; animation: rise .8s var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } }
  .ring { width: 92px; height: 92px; margin: 0 auto 26px; }
  .ring circle { fill: none; stroke: var(--ok); stroke-width: 3; stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1s .1s var(--ease) forwards; }
  .ring path { fill: none; stroke: var(--ok); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .6s .7s var(--ease) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .bar { height: 3px; border-radius: 3px; background: var(--line); margin: 28px auto 0; max-width: 220px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); animation: fill 2.2s var(--ease) forwards; } @keyframes fill { to { width: 100%; } }
  /* right */
  .right { position: relative; border-radius: 28px; overflow: hidden; background: #08060f; isolation: isolate; border: 1px solid var(--line); }
  #aurora { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
  .right::after { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(100% 80% at 50% 110%, rgba(8,6,15,.8), transparent 60%); }
  .chip { position: absolute; top: 24px; right: 24px; display: flex; align-items: center; gap: 10px; padding: 9px 16px 9px 10px; border-radius: 999px; background: rgba(13,11,20,.45); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.14); font-size: 13px; }
  .faces { display: flex; } .faces i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #1a1626; margin-left: -8px; } .faces i:first-child { margin-left: 0; }
  .quote { position: absolute; left: 28px; right: 28px; bottom: 28px; padding: 30px; border-radius: 22px; background: rgba(13,11,20,.5); backdrop-filter: blur(22px); border: 1px solid rgba(255,255,255,.14); }
  .quote blockquote { font: 400 clamp(1.3rem, 2vw, 1.75rem)/1.25 var(--serif); min-height: 4.8em; transition: opacity .5s, transform .6s var(--ease); }
  .quote.swap blockquote, .quote.swap .who { opacity: 0; transform: translateY(8px); }
  .who { display: flex; align-items: center; gap: 12px; margin-top: 20px; transition: opacity .5s; }
  .who b { display: block; font-weight: 600; font-size: 14px; } .who span { color: #b8b2c9; font-size: 13px; }
  .av { width: 40px; height: 40px; border-radius: 50%; }
  .dots { display: flex; gap: 6px; margin-left: auto; } .dots button { width: 8px; height: 8px; border-radius: 8px; border: 0; background: rgba(255,255,255,.25); cursor: pointer; transition: .5s var(--ease); padding: 0; } .dots button.on { width: 26px; background: var(--accent); }
  @media (max-width: 900px) { .shell { grid-template-columns: 1fr; } .right { display: none; } .left { padding: 18px 12px; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; } }
</style>
</head>
<body>
<div class="shell">
  <section class="left">
    <div class="logo"><i></i>Lumen</div>
    <div class="center">
      <div class="card">
        <div id="formWrap">
          <h1>Welcome <em>back.</em></h1>
          <p class="sub">Sign in to pick up right where you left off.</p>
          <div class="socials">
            <button class="soc" type="button" data-p="Google"><svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.8-5.5 3.8a6 6 0 0 1 0-12c1.9 0 3.1.8 3.8 1.5l2.6-2.5A9.6 9.6 0 0 0 12 2.4a9.6 9.6 0 1 0 0 19.2c5.5 0 9.2-3.9 9.2-9.3 0-.6-.1-1.1-.2-1.600z"/></svg>Google</button>
            <button class="soc" type="button" data-p="GitHub"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.200.7-3.900-1.500-3.900-1.500-.5-1.300-1.300-1.700-1.300-1.700-1-.7.1-.7.1-.7 1.200.1 1.800 1.200 1.800 1.200 1 1.800 2.700 1.300 3.300 1 .1-.8.4-1.300.7-1.600-2.600-.3-5.300-1.300-5.300-5.700 0-1.300.5-2.300 1.200-3.100-.1-.3-.5-1.500.1-3.100 0 0 1-.3 3.200 1.200a11 11 0 0 1 5.800 0c2.200-1.500 3.200-1.200 3.200-1.200.6 1.600.2 2.800.1 3.100.8.800 1.200 1.800 1.200 3.100 0 4.400-2.700 5.400-5.300 5.700.4.400.8 1.100.8 2.200v3.200c0 .3.2.7.8.6A11.500 11.500 0 0 0 12 .5z"/></svg>GitHub</button>
          </div>
          <div class="or">or with email</div>
          <form id="form" novalidate>
            <div class="field" id="fEmail">
              <input id="email" type="email" placeholder=" " autocomplete="email" />
              <label for="email">Work email</label>
              <span class="ic tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.500 4.500L19 7.500"/></svg></span>
            </div>
            <div class="hint" id="hEmail"></div>
            <div class="field" id="fPass">
              <input id="pass" type="password" placeholder=" " autocomplete="current-password" />
              <label for="pass">Password</label>
              <button class="ic" type="button" id="eye" aria-label="Show password"><svg id="eyeI" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.500-7 10-7 10 7 10 7-3.500 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
            <div class="hint" id="hPass"></div>
            <div class="row">
              <label class="check"><input type="checkbox" checked /> Keep me signed in</label>
              <a href="#" onclick="return false">Forgot password?</a>
            </div>
            <button class="submit" id="go" type="submit"><span class="spin"></span><span class="lbl">Sign in</span></button>
          </form>
          <p class="foot">New to Lumen? <a href="#" onclick="return false">Create an account</a></p>
          <p class="demo">Demo — any valid email and an 8+ character password will work.</p>
        </div>
        <div class="ok-state" id="ok">
          <svg class="ring" viewBox="0 0 92 92"><circle cx="46" cy="46" r="41"/><path d="M29 47l12 12 23-26"/></svg>
          <h1>You're <em>in.</em></h1>
          <p class="sub" id="okMsg">Taking you to your workspace…</p>
          <div class="bar"><i></i></div>
          <p class="foot"><a href="#" id="again">← Back to sign in</a></p>
        </div>
      </div>
    </div>
  </section>

  <aside class="right">
    <canvas id="aurora"></canvas>
    <div class="chip"><span class="faces"><i style="background:#ffb454"></i><i style="background:#ff6a8b"></i><i style="background:#8c7bff"></i><i style="background:#4ad6c4"></i></span>Loved by 12,000+ teams</div>
    <div class="quote" id="quote">
      <blockquote id="qText"></blockquote>
      <div class="who"><span class="av" id="qAv"></span><div><b id="qName"></b><span id="qRole"></span></div><div class="dots" id="dots"></div></div>
    </div>
  </aside>
</div>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const email = $('#email'), pass = $('#pass'), form = $('#form'), go = $('#go');
  const fE = $('#fEmail'), fP = $('#fPass'), hE = $('#hEmail'), hP = $('#hPass');
  const reE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  const state = { e: false, p: false };

  const setE = (final) => {
    const v = email.value.trim();
    state.e = reE.test(v);
    fE.classList.toggle('good', state.e);
    const bad = final ? !state.e : v.length > 4 && !state.e && !email.matches(':focus');
    fE.classList.toggle('bad', bad);
    hE.textContent = bad ? (v ? 'That doesn’t look like a full email address.' : 'Enter your email to continue.') : '';
  };
  const setP = (final) => {
    const v = pass.value;
    state.p = v.length >= 8;
    const bad = final && !state.p;
    fP.classList.toggle('bad', bad); fP.classList.toggle('good', state.p);
    hP.className = 'hint';
    hP.textContent = bad ? (v ? 'Use at least 8 characters.' : 'Enter your password.') : '';
  };
  email.addEventListener('input', () => setE(false)); email.addEventListener('blur', () => setE(false));
  pass.addEventListener('input', () => setP(false));
  pass.addEventListener('blur', () => { if (pass.value) setP(true); });
  pass.addEventListener('keydown', capsCheck); pass.addEventListener('keyup', capsCheck);
  function capsCheck(e) {
    if (!e.getModifierState) return;
    if (e.getModifierState('CapsLock')) { fP.classList.remove('bad'); hP.className = 'hint warn'; hP.textContent = '⇪ Caps Lock is on.'; }
    else if (hP.classList.contains('warn')) { hP.className = 'hint'; hP.textContent = ''; }
  }
  $('#eye').addEventListener('click', () => {
    const show = pass.type === 'password';
    pass.type = show ? 'text' : 'password';
    $('#eye').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    $('#eyeI').innerHTML = show ? '<path d="M3 3l18 18M10.600 6.100A10 10 0 0 1 12 5c6.500 0 10 7 10 7a17 17 0 0 1-3.200 4M6.600 6.600A17 17 0 0 0 2 12s3.500 7 10 7c1.700 0 3.200-.4 4.500-1.100M9.900 9.900a3 3 0 0 0 4.200 4.200"/>' : '<path d="M2 12s3.500-7 10-7 10 7 10 7-3.500 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
    pass.focus();
  });
  const showOk = (msg) => { $('#formWrap').style.display = 'none'; $('#okMsg').textContent = msg; $('#ok').classList.add('show'); };
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    setE(true); setP(true);
    if (!state.e || !state.p) {
      const card = $('.card'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      (state.e ? pass : email).focus();
      return;
    }
    go.classList.add('loading'); go.disabled = true;
    setTimeout(() => { go.classList.remove('loading'); go.disabled = false; showOk('Welcome back, ' + email.value.split('@')[0] + '. Taking you to your workspace…'); }, 1300);
  });
  document.querySelectorAll('.soc').forEach((b) => b.addEventListener('click', () => showOk('Connected with ' + b.dataset.p + '. Taking you to your workspace…')));
  $('#again').addEventListener('click', (e) => { e.preventDefault(); $('#ok').classList.remove('show'); $('#formWrap').style.display = ''; });

  /* testimonials */
  const Q = [
    ['“We replaced four tools with Lumen and our Monday standup now takes eleven minutes.”', 'Maya Okafor', 'Head of Product, Northwind', 'linear-gradient(135deg,#ffb454,#ff6a3d)'],
    ['“The first piece of software my whole team opened without being asked. That never happens.”', 'Jonas Weber', 'CTO, Fieldnote', 'linear-gradient(135deg,#8c7bff,#4ad6c4)'],
    ['“Setup took an afternoon. The support replies came faster than my own email.”', 'Priya Raman', 'Founder, Tidal Studio', 'linear-gradient(135deg,#ff6a8b,#ffb454)'],
  ];
  let qi = 0, timer;
  const dots = $('#dots');
  Q.forEach((_, i) => { const b = document.createElement('button'); b.setAttribute('aria-label', 'Testimonial ' + (i + 1)); b.onclick = () => { show(i); restart(); }; dots.appendChild(b); });
  function show(i, instant) {
    const box = $('#quote');
    const apply = () => { qi = i; $('#qText').textContent = Q[i][0]; $('#qName').textContent = Q[i][1]; $('#qRole').textContent = Q[i][2]; $('#qAv').style.background = Q[i][3]; [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i)); box.classList.remove('swap'); };
    if (instant) return apply();
    box.classList.add('swap'); setTimeout(apply, 380);
  }
  const restart = () => { clearInterval(timer); timer = setInterval(() => show((qi + 1) % Q.length), 6000); };
  show(0, true); restart();

  /* aurora canvas */
  const cv = $('#aurora'), ctx = cv.getContext('2d');
  let W, H, dpr, mx = .5, my = .5, sx = .5, sy = .5;
  const blobs = [[.3,.3,.55,'255,180,84',.5],[.7,.25,.5,'255,106,139',.4],[.5,.7,.6,'140,123,255',.5],[.2,.8,.45,'74,214,196',.35],[.85,.75,.5,'255,106,61',.35]];
  const size = () => { dpr = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; };
  size(); addEventListener('resize', size);
  cv.parentElement.addEventListener('pointermove', (e) => { const r = cv.getBoundingClientRect(); mx = (e.clientX - r.left) / r.width; my = (e.clientY - r.top) / r.height; });
  const loop = (t) => {
    t *= .00018; sx += (mx - sx) * .04; sy += (my - sy) * .04;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#08060f'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    blobs.forEach((b, i) => {
      let x = (b[0] + Math.sin(t * (1 + i * .3) + i * 2) * .18) * W, y = (b[1] + Math.cos(t * (1.2 + i * .2) + i) * .16) * H;
      if (i === 0) { x += (sx - .5) * W * .5; y += (sy - .5) * H * .5; }
      const r = b[2] * Math.max(W, H) * .6;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${b[3]},${b[4]})`); g.addColorStop(1, `rgba(${b[3]},0)`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    });
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
