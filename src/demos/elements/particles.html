<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Particle playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  /* ── tweak me ─────────────────────────────── */
  :root { --bg: #05060a; --fg: #eaf6ff; --muted: #6f8190; --accent: #6ee7ff; --sans: 'Space Grotesk', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace; --ease: cubic-bezier(.16,1,.3,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; } body { background: var(--bg); color: var(--fg); font-family: var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  .hd { position: fixed; top: 22px; left: 24px; pointer-events: none; } .hd h1 { font-size: clamp(1.4rem, 3vw, 2rem); letter-spacing: -.04em; } .hd p { font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .stat { position: fixed; top: 24px; right: 24px; text-align: right; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); pointer-events: none; line-height: 1.8; } .stat b { color: var(--accent); font-weight: 500; }
  .ui { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 22px; background: rgba(10,14,22,.65); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.12); max-width: calc(100vw - 20px); box-shadow: 0 30px 60px -20px #000; }
  .seg { display: flex; gap: 2px; position: relative; } .seg button { position: relative; z-index: 1; border: 0; background: none; color: var(--muted); font: 600 13px var(--sans); padding: 10px 15px; border-radius: 14px; cursor: pointer; transition: color .3s; display: flex; gap: 7px; align-items: center; white-space: nowrap; } .seg button:hover { color: var(--fg); } .seg button.on { color: #03121a; } .seg .th { position: absolute; top: 0; bottom: 0; border-radius: 14px; background: var(--accent); transition: .5s var(--ease); box-shadow: 0 0 24px -4px var(--accent); }
  .sep { width: 1px; height: 26px; background: rgba(255,255,255,.14); } .pal { display: flex; gap: 8px; padding: 0 8px; } .pal button { width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--g); cursor: pointer; transition: .4s var(--ease); } .pal button:hover { transform: scale(1.2); } .pal button.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #fff; }
  @media (max-width: 640px) { .seg button span { display: none; } .stat { display: none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive particle field"></canvas>
<div class="hd"><h1>Particle playground</h1><p>Move · hold · click to burst</p></div>
<div class="stat">Particles <b id="n">0</b><br />FPS <b id="fps">60</b></div>
<div class="ui"><div class="seg" id="modes"><i class="th"></i><button class="on" data-m="0"><span>Attract</span>⦿</button><button data-m="1"><span>Repel</span>✺</button><button data-m="2"><span>Swirl</span>🌀</button><button data-m="3"><span>Ring</span>◎</button></div><i class="sep"></i><div class="pal" id="pal"></div></div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
  const PAL = [['linear-gradient(135deg,#6ee7ff,#8b6bff)', ['#6ee7ff', '#8bb8ff', '#8b6bff', '#d4a8ff']], ['linear-gradient(135deg,#ffb347,#ff3d6e)', ['#ffd166', '#ff9f43', '#ff5e5b', '#ff3d6e']], ['linear-gradient(135deg,#ffffff,#6a7280)', ['#ffffff', '#cfd6e0', '#98a2b3', '#6a7280']]];
  let W, H, dpr, N = 0, x, y, vx, vy, col; let mode = 0, pal = 0, px = 0, py = 0, down = false, active = false, lastMove = 0;
  const size = () => { dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H); const n = Math.min(11000, Math.max(2500, Math.round((W * H) / 110))); if (n !== N) init(n); px = px || W / 2; py = py || H / 2; };
  function init(n) { N = n; x = new Float32Array(n); y = new Float32Array(n); vx = new Float32Array(n); vy = new Float32Array(n); col = new Uint8Array(n); for (let i = 0; i < n; i++) { x[i] = Math.random() * W; y[i] = Math.random() * H; col[i] = i & 3; } document.getElementById('n').textContent = n.toLocaleString(); }
  addEventListener('resize', size); size();
  cv.addEventListener('pointermove', (e) => { px = e.clientX; py = e.clientY; active = true; lastMove = performance.now(); });
  cv.addEventListener('pointerdown', (e) => { down = true; px = e.clientX; py = e.clientY; active = true; lastMove = performance.now(); burst(px, py); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointerup', () => down = false); cv.addEventListener('pointerleave', () => { active = false; down = false; });
  function burst(bx, by) { for (let i = 0; i < N; i++) { const dx = x[i] - bx, dy = y[i] - by, d = Math.hypot(dx, dy) + .001, f = Math.max(0, 1 - d / 320) * 22; vx[i] += (dx / d) * f; vy[i] += (dy / d) * f; } }
  const th = document.querySelector('.th'), btns = [...document.querySelectorAll('#modes button')];
  const place = () => { const on = document.querySelector('#modes .on'); th.style.left = on.offsetLeft + 'px'; th.style.width = on.offsetWidth + 'px'; };
  btns.forEach((b) => b.onclick = () => { btns.forEach((o) => o.classList.toggle('on', o === b)); mode = +b.dataset.m; place(); });
  document.getElementById('pal').innerHTML = PAL.map((p, i) => `<button class="${i ? '' : 'on'}" style="--g:${p[0]}" aria-label="Palette ${i + 1}"></button>`).join('');
  document.querySelectorAll('#pal button').forEach((b, i) => b.onclick = () => { pal = i; document.querySelectorAll('#pal button').forEach((o) => o.classList.toggle('on', o === b)); });
  setTimeout(place, 50); document.fonts && document.fonts.ready.then(place);

  let running = true, looping = false, frames = 0, ft = performance.now(), tPrev = performance.now();
  new IntersectionObserver(([e]) => { running = e.isIntersecting; if (running && !looping) { looping = true; loop(); } }).observe(cv);
  document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running && !looping) { looping = true; loop(); } });
  function loop(now = performance.now()) {
    if (!running) { looping = false; return; }
    if (typeof now !== 'number') now = performance.now();
    const dt = Math.min(2, (now - tPrev) / 16.67); tPrev = now;
    /* idle: a lissajous "ghost cursor" keeps the field alive */
    let cx = px, cy = py; if (!active || now - lastMove > 3500) { const t = now / 1000; cx = W / 2 + Math.sin(t * .7) * W * .3; cy = H / 2 + Math.sin(t * 1.1 + 1) * H * .25; }
    ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(5,6,10,.2)'; ctx.fillRect(0, 0, W, H);
    const R = down ? 1.8 : 1, ring = Math.min(W, H) * .2; const palette = PAL[pal][1];
    for (let i = 0; i < N; i++) {
      const dx = cx - x[i], dy = cy - y[i], d2 = dx * dx + dy * dy + 60, d = Math.sqrt(d2);
      let fx = 0, fy = 0;
      if (mode === 0) { const f = Math.min(1.6, 5200 / d2) * R; fx = (dx / d) * f; fy = (dy / d) * f; }
      else if (mode === 1) { if (d < 240) { const f = (1 - d / 240) * 3 * R; fx = -(dx / d) * f; fy = -(dy / d) * f; } }
      else if (mode === 2) { const f = Math.min(1.8, 4200 / d2) * R; fx = (dx / d) * f * .35 - (dy / d) * f * 1.1; fy = (dy / d) * f * .35 + (dx / d) * f * 1.1; }
      else { const e = (d - ring) * .0035 * R; fx = (dx / d) * e; fy = (dy / d) * e; const s = Math.exp(-Math.abs(d - ring) / 80) * .18; fx += -(dy / d) * s; fy += (dx / d) * s; }
      vx[i] = (vx[i] + fx * dt) * .965; vy[i] = (vy[i] + fy * dt) * .965; x[i] += vx[i] * dt; y[i] += vy[i] * dt;
      if (x[i] < 0) x[i] += W; else if (x[i] > W) x[i] -= W; if (y[i] < 0) y[i] += H; else if (y[i] > H) y[i] -= H;
    }
    for (let c = 0; c < 4; c++) { ctx.fillStyle = palette[c]; ctx.beginPath(); for (let i = c; i < N; i += 4) { const s = 1.1 + Math.min(1.6, (Math.abs(vx[i]) + Math.abs(vy[i])) * .25); ctx.rect(x[i], y[i], s, s); } ctx.fill(); }
    frames++; if (now - ft > 600) { document.getElementById('fps').textContent = Math.round((frames * 1000) / (now - ft)); frames = 0; ft = now; }
    requestAnimationFrame(loop);
  }
  looping = true; loop();
})();
</script>
</body>
</html>
