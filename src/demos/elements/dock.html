<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Magnifying dock</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet" />
<style>
  /* ── tweak me ─────────────────────────────── */
  :root { --base: 54px; --max: 100px; --reach: 150px; --sans: 'Inter', system-ui, sans-serif; --serif: 'Fraunces', Georgia, serif; --ease: cubic-bezier(.16,1,.3,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; font-family: var(--sans); color: #fff; overflow: hidden; -webkit-font-smoothing: antialiased; position: relative;
    background: radial-gradient(70% 60% at 20% 20%, #ff9a5c 0%, transparent 60%), radial-gradient(60% 60% at 85% 30%, #b45cff 0%, transparent 60%), radial-gradient(80% 70% at 50% 100%, #2b3bff 0%, transparent 65%), #1a1030; }
  body::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.12) 1px, transparent 1.4px) 0 0 / 24px 24px; mask-image: linear-gradient(#000, transparent 70%); -webkit-mask-image: linear-gradient(#000, transparent 70%); }
  .menu { position: absolute; top: 0; left: 0; right: 0; height: 30px; display: flex; align-items: center; gap: 20px; padding: 0 18px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,.12); backdrop-filter: blur(20px); } .menu span:last-child { margin-left: auto; font-weight: 500; opacity: .9; }
  .win { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: min(560px, 88vw); border-radius: 18px; background: rgba(255,255,255,.14); backdrop-filter: blur(30px) saturate(1.4); border: 1px solid rgba(255,255,255,.25); box-shadow: 0 50px 80px -30px rgba(0,0,0,.5); overflow: hidden; }
  .win .bar { display: flex; gap: 8px; padding: 13px 16px; } .win .bar i { width: 12px; height: 12px; border-radius: 50%; } .win .bd { padding: 12px 34px 40px; text-align: center; } .win h1 { font: italic 500 clamp(2rem, 6vw, 3.4rem)/1 var(--serif); letter-spacing: -.02em; } .win p { margin-top: 12px; opacity: .8; font-size: 15px; }
  .dock-wrap { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; }
  .dock { display: flex; align-items: flex-end; gap: 10px; padding: 10px 12px; height: calc(var(--base) + 26px); border-radius: 26px; background: rgba(255,255,255,.2); backdrop-filter: blur(30px) saturate(1.6); border: 1px solid rgba(255,255,255,.35); box-shadow: 0 30px 60px -20px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08) inset; max-width: calc(100vw - 20px); }
  .app { position: relative; width: var(--base); height: var(--base); flex: none; display: grid; place-items: center; }
  .ico { position: absolute; bottom: 0; left: 50%; width: 100%; height: 100%; transform: translateX(-50%); border-radius: 22%; display: grid; place-items: center; font-size: calc(var(--s, 54px) * .5); box-shadow: 0 8px 16px -6px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.45); cursor: pointer; background: var(--g); will-change: width, height; }
  .app .tip { position: absolute; bottom: calc(100% + 14px); left: 50%; transform: translate(-50%, 8px) scale(.9); padding: 6px 12px; border-radius: 10px; background: rgba(20,16,32,.85); backdrop-filter: blur(12px); font-size: 13px; font-weight: 600; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .25s, transform .4s var(--ease); border: 1px solid rgba(255,255,255,.15); } .app:hover .tip { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .app .run { position: absolute; bottom: -8px; left: 50%; width: 4px; height: 4px; border-radius: 50%; background: #fff; margin-left: -2px; opacity: 0; } .app.on .run { opacity: .9; }
  .sep { width: 1px; align-self: stretch; margin: 6px 4px; background: rgba(255,255,255,.35); flex: none; }
  @keyframes bounce { 0%, 100% { transform: translate(-50%, 0); } 30% { transform: translate(-50%, -26px); } 55% { transform: translate(-50%, 0); } 75% { transform: translate(-50%, -10px); } }
  .ico.b { animation: bounce .9s var(--ease); }
  .toast { position: absolute; left: 50%; bottom: 150px; transform: translate(-50%, 20px); opacity: 0; padding: 10px 18px; border-radius: 99px; background: rgba(20,16,32,.8); backdrop-filter: blur(14px); font-size: 14px; font-weight: 600; transition: .5s var(--ease); pointer-events: none; } .toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="menu"><span></span><span>Finder</span><span>File</span><span>Edit</span><span>View</span><span id="clock"></span></div>
<div class="win"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><div class="bd"><h1>Hover the dock</h1><p>Icons swell smoothly as your cursor approaches — one distance function, no libraries.</p></div></div>
<div class="toast" id="toast"></div>
<div class="dock-wrap"><div class="dock" id="dock"></div></div>
<script>
(() => {
  const APPS = [['Finder', '😀', 'linear-gradient(160deg,#5ac8fa,#1d6fe5)', 1], ['Messages', '💬', 'linear-gradient(160deg,#6ee86b,#1fa83a)'], ['Mail', '✉️', 'linear-gradient(160deg,#58b4ff,#2563eb)'], ['Photos', '🌸', 'linear-gradient(160deg,#ffd1dc,#ff7eb3)'], 0, ['Music', '🎵', 'linear-gradient(160deg,#ff6b81,#e0194a)', 1], ['Notes', '📝', 'linear-gradient(160deg,#ffe97a,#f2b705)'], ['Maps', '🧭', 'linear-gradient(160deg,#7be0a4,#2aa1ff)'], ['Terminal', '⌨️', 'linear-gradient(160deg,#4b5563,#111827)'], 0, ['Trash', '🗑️', 'linear-gradient(160deg,#cbd5e1,#64748b)']];
  const dock = document.getElementById('dock'), apps = [];
  APPS.forEach((a) => { if (!a) { const s = document.createElement('i'); s.className = 'sep'; dock.appendChild(s); return; } const el = document.createElement('div'); el.className = 'app' + (a[3] ? ' on' : ''); el.innerHTML = `<span class="tip">${a[0]}</span><div class="ico" style="--g:${a[2]}">${a[1]}</div><i class="run"></i>`; dock.appendChild(el); apps.push(el); el.addEventListener('click', () => { const ic = el.querySelector('.ico'); ic.classList.remove('b'); void ic.offsetWidth; ic.classList.add('b'); el.classList.add('on'); const t = document.getElementById('toast'); t.textContent = 'Opening ' + a[0] + '…'; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 1400); }); });
  const css = getComputedStyle(document.documentElement), BASE = parseFloat(css.getPropertyValue('--base')), MAX = parseFloat(css.getPropertyValue('--max')), REACH = parseFloat(css.getPropertyValue('--reach'));
  const sizes = apps.map(() => BASE), target = apps.map(() => BASE); let x = null, raf;
  const loop = () => {
    let moving = false;
    apps.forEach((el, i) => {
      if (x !== null) { const r = el.getBoundingClientRect(), c = r.left + r.width / 2, d = Math.abs(x - c); target[i] = BASE + (MAX - BASE) * Math.exp(-(d * d) / (2 * (REACH / 2.2) ** 2)); } else target[i] = BASE;
      sizes[i] += (target[i] - sizes[i]) * .22; if (Math.abs(target[i] - sizes[i]) > .1) moving = true;
      const ic = el.querySelector('.ico'); el.style.width = sizes[i] + 'px'; el.style.height = BASE + 'px'; ic.style.width = sizes[i] + 'px'; ic.style.height = sizes[i] + 'px'; ic.style.setProperty('--s', sizes[i] + 'px');
    });
    raf = moving || x !== null ? requestAnimationFrame(loop) : null;
  };
  const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };
  dock.addEventListener('pointermove', (e) => { if (e.pointerType === 'touch') return; x = e.clientX; kick(); });
  dock.addEventListener('pointerleave', () => { x = null; kick(); });
  dock.addEventListener('touchmove', (e) => { x = e.touches[0].clientX; kick(); }, { passive: true }); dock.addEventListener('touchend', () => { x = null; kick(); });
  const clock = () => document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); clock(); setInterval(clock, 20000);
  kick();
})();
</script>
</body>
</html>
