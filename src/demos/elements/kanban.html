<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kanban board</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ── tweak me ─────────────────────────────── */
  :root { --bg: #0e0b12; --col: #151119; --card: #1d1824; --fg: #f3eff7; --muted: #8e869a; --line: rgba(255,255,255,.08); --accent: #ff9bd0; --sans: 'Sora', system-ui, sans-serif; --ease: cubic-bezier(.16,1,.3,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: var(--bg); color: var(--fg); font-family: var(--sans); padding: 28px 22px; -webkit-font-smoothing: antialiased; overflow-x: hidden; background-image: radial-gradient(45% 40% at 90% 0%, rgba(255,155,208,.12), transparent 70%), radial-gradient(40% 40% at 0% 100%, rgba(139,107,255,.12), transparent 70%); user-select: none; -webkit-user-select: none; }
  .top { max-width: 1100px; margin: 0 auto 22px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; } .top h1 { font-size: clamp(1.6rem, 3.6vw, 2.4rem); letter-spacing: -.045em; } .top h1 em { font-style: normal; color: var(--accent); } .top p { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
  .team { display: flex; } .team i { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--bg); margin-left: -8px; display: grid; place-items: center; font: 700 11px var(--sans); font-style: normal; color: #1a0f1a; }
  .board { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
  .col { background: var(--col); border: 1px solid var(--line); border-radius: 22px; padding: 14px; min-height: 380px; transition: border-color .3s, background .3s; } .col.over { border-color: color-mix(in srgb, var(--c) 60%, transparent); background: color-mix(in srgb, var(--c) 6%, var(--col)); }
  .ch { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; font-weight: 700; font-size: 14px; } .ch i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 12px var(--c); } .ch .n { margin-left: auto; font-size: 12px; font-weight: 600; background: rgba(255,255,255,.08); color: var(--muted); padding: 3px 9px; border-radius: 99px; min-width: 26px; text-align: center; transition: transform .4s var(--ease); } .ch .n.b { transform: scale(1.3); color: var(--c); }
  .cards { display: grid; gap: 10px; min-height: 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 14px 12px; cursor: grab; touch-action: none; transition: border-color .3s, transform .5s var(--ease), box-shadow .5s var(--ease); position: relative; } .card:hover { border-color: rgba(255,255,255,.22); transform: translateY(-2px); }
  .card p { font-size: 14px; font-weight: 600; line-height: 1.4; letter-spacing: -.01em; } .meta { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; } .tag { font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 99px; } .av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 10px var(--sans); color: #1a0f1a; }
  .card.ph { background: transparent; border: 2px dashed color-mix(in srgb, var(--c, #fff) 50%, transparent); height: var(--h); opacity: .8; padding: 0; } .card.ph > * { display: none; } .card.src { display: none; }
  .ghost { position: fixed; z-index: 100; pointer-events: none; margin: 0; cursor: grabbing; box-shadow: 0 30px 50px -14px rgba(0,0,0,.7), 0 0 0 1px rgba(255,155,208,.5); transition: none; border-color: var(--accent); background: #251d2e; will-change: transform; } .ghost.land { transition: transform .35s var(--ease), left .35s var(--ease), top .35s var(--ease), box-shadow .35s; }
  .add { margin-top: 10px; display: flex; gap: 8px; } .add input { flex: 1; min-width: 0; height: 40px; padding: 0 14px; border-radius: 12px; border: 1px dashed rgba(255,255,255,.18); background: transparent; color: var(--fg); font: 500 13.5px var(--sans); outline: none; transition: .3s; user-select: text; -webkit-user-select: text; } .add input:focus { border-style: solid; border-color: var(--c); background: rgba(255,255,255,.03); } .add input::placeholder { color: #6f677b; }
  .empty { display: grid; place-items: center; height: 70px; border-radius: 14px; border: 1px dashed var(--line); color: #6f677b; font-size: 13px; }
  @media (max-width: 760px) { .board { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="top"><div><h1>Sprint <em>14.</em></h1><p>Drag cards between columns · add tasks at the bottom</p></div><div class="team"><i style="background:#ff9bd0">AK</i><i style="background:#9bd0ff">JM</i><i style="background:#c8ff9b">PS</i><i style="background:#ffd49b">+2</i></div></div>
<div class="board" id="board"></div>
<script>
(() => {
  const COLS = [['To do', '#9bb4ff'], ['In progress', '#ff9bd0'], ['Done', '#8fffc0']];
  const TAGS = { Design: ['#ff9bd0', 'rgba(255,155,208,.14)'], Dev: ['#9bb4ff', 'rgba(155,180,255,.14)'], Research: ['#ffd49b', 'rgba(255,212,155,.14)'], Bug: ['#ff8a8a', 'rgba(255,138,138,.14)'], Docs: ['#8fffc0', 'rgba(143,255,192,.14)'] };
  const AV = ['#ff9bd0', '#9bd0ff', '#c8ff9b', '#ffd49b'];
  const INIT = [[['Redesign onboarding checklist', 'Design'], ['Interview 5 churned customers', 'Research'], ['Write API rate-limit docs', 'Docs']], [['Ship dark mode to settings', 'Dev'], ['Fix avatar upload on Safari', 'Bug']], [['Set up error monitoring', 'Dev'], ['Brand refresh moodboard', 'Design']]];
  const board = document.getElementById('board'); let uid = 0;
  const mk = (t, tag) => { const c = document.createElement('div'); c.className = 'card'; c.dataset.id = ++uid; const [fg, bg] = TAGS[tag] || TAGS.Dev; c.innerHTML = `<p></p><div class="meta"><span class="tag" style="color:${fg};background:${bg}">${tag}</span><span class="av" style="background:${AV[uid % 4]}">${'AJPS'[uid % 4]}${'KMSR'[uid % 4]}</span></div>`; c.querySelector('p').textContent = t; return c; };
  COLS.forEach(([name, color], ci) => { const col = document.createElement('section'); col.className = 'col'; col.style.setProperty('--c', color); col.innerHTML = `<div class="ch"><i></i>${name}<span class="n">0</span></div><div class="cards"></div><div class="add"><input placeholder="+ Add a task" aria-label="Add task to ${name}" maxlength="60" /></div>`; const list = col.querySelector('.cards'); INIT[ci].forEach(([t, g]) => list.appendChild(mk(t, g))); board.appendChild(col); col.querySelector('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.value.trim()) { const c = mk(e.target.value.trim(), Object.keys(TAGS)[Math.floor(Math.random() * 5)]); list.appendChild(c); c.animate([{ opacity: 0, transform: 'translateY(14px) scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 500, easing: 'cubic-bezier(.16,1,.3,1)' }); e.target.value = ''; count(); } }); });
  const cols = () => [...document.querySelectorAll('.col')];
  function count() { cols().forEach((col) => { const n = col.querySelector('.cards').querySelectorAll('.card:not(.ph):not(.src)').length, el = col.querySelector('.n'); if (el.textContent != n) { el.textContent = n; el.classList.add('b'); setTimeout(() => el.classList.remove('b'), 300); } const l = col.querySelector('.cards'); let e = l.querySelector('.empty'); if (!n && !l.querySelector('.ph') && !e) { e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Drop a card here'; l.appendChild(e); } else if ((n || l.querySelector('.ph')) && e) e.remove(); }); }
  count();
  let drag = null;
  board.addEventListener('pointerdown', (e) => {
    const card = e.target.closest('.card'); if (!card || e.button > 0 || e.target.closest('input')) return;
    const r = card.getBoundingClientRect(), ghost = card.cloneNode(true), ph = document.createElement('div');
    ph.className = 'card ph'; ph.style.setProperty('--h', r.height + 'px'); ph.style.setProperty('--c', card.closest('.col').style.getPropertyValue('--c'));
    ghost.className = 'card ghost'; ghost.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px`; document.body.appendChild(ghost);
    card.parentNode.insertBefore(ph, card); card.classList.add('src');
    drag = { card, ghost, ph, ox: e.clientX - r.left, oy: e.clientY - r.top, lx: e.clientX, id: e.pointerId };
    board.setPointerCapture(e.pointerId); e.preventDefault();
  });
  board.addEventListener('pointermove', (e) => {
    if (!drag) return; const { ghost, ph } = drag, vx = e.clientX - drag.lx; drag.lx = e.clientX;
    ghost.style.left = e.clientX - drag.ox + 'px'; ghost.style.top = e.clientY - drag.oy + 'px'; ghost.style.transform = `rotate(${Math.max(-8, Math.min(8, vx * .6)) + 2}deg) scale(1.03)`;
    let target = null; cols().forEach((c) => { const r = c.getBoundingClientRect(); const over = e.clientX > r.left && e.clientX < r.right; c.classList.toggle('over', over); if (over) target = c; });
    if (!target) return; const list = target.querySelector('.cards'); list.querySelector('.empty')?.remove(); ph.style.setProperty('--c', target.style.getPropertyValue('--c'));
    const others = [...list.querySelectorAll('.card:not(.ph):not(.src)')]; let before = null;
    for (const c of others) { const r = c.getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { before = c; break; } }
    if (before) { if (ph.nextElementSibling !== before) list.insertBefore(ph, before); } else if (list.lastElementChild !== ph) list.appendChild(ph);
    count();
  });
  const drop = () => {
    if (!drag) return; const { card, ghost, ph } = drag; drag = null; cols().forEach((c) => c.classList.remove('over'));
    const r = ph.getBoundingClientRect(); ghost.classList.add('land'); ghost.style.left = r.left + 'px'; ghost.style.top = r.top + 'px'; ghost.style.transform = 'none';
    setTimeout(() => { ph.replaceWith(card); card.classList.remove('src'); ghost.remove(); count(); }, 340);
  };
  board.addEventListener('pointerup', drop); board.addEventListener('pointercancel', drop);
})();
</script>
</body>
</html>
