<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Type playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  /* ── tweak me ─────────────────────────────── */
  :root { --bg: #f2efe9; --ink: #16130f; --muted: #857d71; --line: #ddd6ca; --accent: #ff5a36; --sans: 'Inter', system-ui, sans-serif; --serif: 'Instrument Serif', Georgia, serif; --mono: 'JetBrains Mono', ui-monospace, monospace; --ease: cubic-bezier(.16,1,.3,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--sans); padding: 18px; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .grid { display: grid; grid-template-columns: 1.15fr 1fr; grid-template-rows: auto auto; gap: 14px; max-width: 1180px; margin: 0 auto; min-height: calc(100vh - 36px); }
  .p { position: relative; border-radius: 28px; padding: 26px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--line); background: #faf8f4; min-height: 300px; } .p small { font: 500 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; } .p small b { color: var(--accent); font-weight: 500; }
  .p.dark { background: var(--ink); color: #f4efe6; border-color: var(--ink); } .p.dark small { color: #8b8378; } .p.acc { background: var(--accent); color: #1a0903; border-color: var(--accent); } .p.acc small { color: rgba(26,9,3,.6); }
  .scr { margin: auto 0; font: 800 clamp(2.6rem, 8vw, 6.4rem)/.95 var(--sans); letter-spacing: -.06em; cursor: default; } .scr .ch { display: inline-block; min-width: .5ch; } .scr .m { color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; } .chip { border: 1px solid rgba(255,255,255,.2); background: none; color: inherit; font: 500 12px var(--mono); padding: 7px 12px; border-radius: 99px; cursor: pointer; transition: .3s; } .chip:hover, .chip.on { background: var(--accent); border-color: var(--accent); color: #1a0903; }
  .vw { margin: auto 0; font: 400 clamp(2.4rem, 6vw, 4.4rem)/1.02 var(--sans); letter-spacing: -.04em; cursor: default; } .vw span { display: inline-block; font-variation-settings: 'wght' 200; transition: font-variation-settings .12s linear; } .vw span.sp { width: .28em; }
  .mq { margin: auto -26px; overflow: hidden; } .mq .tr { display: flex; width: max-content; font: 400 clamp(2.4rem, 6vw, 4.6rem)/1.15 var(--serif); font-style: italic; white-space: nowrap; letter-spacing: -.02em; will-change: transform; } .mq .tr + .tr { font: 800 clamp(2.4rem, 6vw, 4.6rem)/1.15 var(--sans); font-style: normal; letter-spacing: -.05em; -webkit-text-stroke: 1.5px currentColor; color: transparent; } .mq .tr i { font-style: normal; color: var(--accent); margin: 0 .5em; -webkit-text-stroke: 0; }
  .wave { margin: auto 0; font: 800 clamp(2.4rem, 7vw, 5.2rem)/1 var(--sans); letter-spacing: -.05em; display: flex; flex-wrap: wrap; } .wave span { display: inline-block; will-change: transform; } .wave span.sp { width: .28em; }
  .tip { position: absolute; right: 22px; bottom: 18px; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; opacity: .55; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="grid">
  <section class="p dark"><small><span>01 · Scramble decode</span><b>Hover</b></small><div class="scr" id="scr" aria-live="off">DESIGN</div><div class="row" id="words"></div></section>
  <section class="p"><small><span>02 · Variable weight</span><b>Move cursor</b></small><div class="vw" id="vw">Weight follows your cursor.</div></section>
  <section class="p acc"><small><span>03 · Velocity marquee</span><b>Scroll / wheel</b></small><div class="mq" id="mq"><div class="tr"></div><div class="tr"></div></div><span class="tip">Faster when you scroll</span></section>
  <section class="p dark"><small><span>04 · Letter wave</span><b>Hover to calm</b></small><div class="wave" id="wave"></div></section>
</div>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* 1 — scramble */
  const WORDS = ['DESIGN', 'MOTION', 'CRAFT', 'DETAIL', 'RHYTHM'], scr = document.getElementById('scr'), chars = '!<>-_\\/[]{}—=+*^?#ABCDEFGHJKLMNOPRSTUVWXYZ';
  let cur = 0, run = 0;
  function scramble(to) { cancelAnimationFrame(run); const from = scr.textContent, len = Math.max(from.length, to.length); const q = Array.from({ length: len }, (_, i) => ({ f: from[i] || '', t: to[i] || '', s: Math.floor(Math.random() * 14), e: 14 + Math.floor(Math.random() * 22), c: '' })); let f = 0; const tick = () => { let out = '', done = 0; q.forEach((o) => { if (f >= o.e) { done++; out += o.t; } else if (f >= o.s) { if (!o.c || Math.random() < .3) o.c = chars[Math.floor(Math.random() * chars.length)]; out += `<span class="m">${o.c}</span>`; } else out += o.f; }); scr.innerHTML = out; if (done < len) { f++; run = requestAnimationFrame(tick); } else scr.textContent = to; }; tick(); }
  const wr = document.getElementById('words'); WORDS.forEach((w, i) => { const b = document.createElement('button'); b.className = 'chip' + (i ? '' : ' on'); b.textContent = w.toLowerCase(); b.onclick = () => { cur = i; [...wr.children].forEach((x, k) => x.classList.toggle('on', k === i)); scramble(w); }; wr.appendChild(b); });
  scr.addEventListener('pointerenter', () => scramble(WORDS[cur]));
  let auto = setInterval(() => { cur = (cur + 1) % WORDS.length; [...wr.children].forEach((x, k) => x.classList.toggle('on', k === cur)); scramble(WORDS[cur]); }, 3200); wr.addEventListener('click', () => clearInterval(auto));
  setTimeout(() => scramble(WORDS[0]), 300);

  /* 2 — variable weight */
  const vw = document.getElementById('vw'), text = vw.textContent; vw.innerHTML = [...text].map((c) => c === ' ' ? '<span class="sp"> </span>' : `<span>${c}</span>`).join('');
  const letters = [...vw.querySelectorAll('span')]; let mx = -999, my = -999;
  const paint = () => letters.forEach((l) => { const r = l.getBoundingClientRect(), d = Math.hypot(mx - (r.left + r.width / 2), my - (r.top + r.height / 2)), w = Math.round(200 + 700 * Math.exp(-(d * d) / (2 * 110 * 110))); l.style.fontVariationSettings = `'wght' ${w}`; });
  addEventListener('pointermove', (e) => { mx = e.clientX; my = e.clientY; if (!reduce) paint(); });
  let t0 = 0; (function idle(t) { if (mx === -999) { const r = vw.getBoundingClientRect(); const x = r.left + ((Math.sin(t / 1400) + 1) / 2) * r.width; letters.forEach((l) => { const b = l.getBoundingClientRect(), d = Math.abs(x - (b.left + b.width / 2)); l.style.fontVariationSettings = `'wght' ${Math.round(200 + 700 * Math.exp(-(d * d) / (2 * 90 * 90)))}`; }); requestAnimationFrame(idle); } })(0);

  /* 3 — velocity marquee */
  const mq = document.getElementById('mq'), rows = [...mq.querySelectorAll('.tr')], PH = ['Type is the voice', 'Set it with care', 'Motion has rhythm'];
  rows.forEach((r) => { r.innerHTML = Array(4).fill(PH.map((p) => `<span>${p}</span><i>✺</i>`).join('')).join(''); });
  let boost = 0, base = [1.1, -1.4], off = [0, 0];
  addEventListener('wheel', (e) => { boost = Math.max(-40, Math.min(40, boost + e.deltaY * .06)); }, { passive: true });
  let ty = 0; addEventListener('touchmove', (e) => { const y = e.touches[0].clientY; boost += (ty - y) * .15; ty = y; }, { passive: true }); addEventListener('touchstart', (e) => ty = e.touches[0].clientY, { passive: true });
  (function loop() { boost *= .94; rows.forEach((r, i) => { off[i] += base[i] + boost * (i ? -1 : 1) * .5; const w = r.scrollWidth / 4; if (off[i] <= -w) off[i] += w; if (off[i] > 0) off[i] -= w; r.style.transform = `translate3d(${off[i]}px,0,0) skewX(${Math.max(-12, Math.min(12, -boost * .3))}deg)`; }); requestAnimationFrame(loop); })();

  /* 4 — wave */
  const wave = document.getElementById('wave'); wave.innerHTML = [...'Hello, wave 👋'].map((c) => c === ' ' ? '<span class="sp"> </span>' : `<span>${c}</span>`).join('');
  const wl = [...wave.querySelectorAll('span')]; let calm = 1; wave.addEventListener('pointerenter', () => calm = .15); wave.addEventListener('pointerleave', () => calm = 1);
  let amp = 1; (function loop(t) { amp += (calm - amp) * .05; wl.forEach((l, i) => { const y = Math.sin(t / 380 + i * .6) * 16 * amp; l.style.transform = reduce ? '' : `translateY(${y}px) rotate(${Math.cos(t / 380 + i * .6) * 4 * amp}deg)`; l.style.color = i % 5 === 0 ? 'var(--accent)' : ''; }); requestAnimationFrame(loop); })(0);
})();
</script>
</body>
</html>
