<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Magnetic buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ── tweak me ─────────────────────────────── */
  :root { --bg: #0b0c10; --fg: #f1f3f7; --muted: #7b8294; --line: rgba(255,255,255,.1); --accent: #d7ff5f; --ink: #0b0d02; --danger: #ff5c6c; --sans: 'Space Grotesk', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace; --ease: cubic-bezier(.16,1,.3,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: var(--bg); color: var(--fg); font-family: var(--sans); display: grid; place-items: center; padding: 28px; -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(50% 50% at 50% 0%, rgba(215,255,95,.08), transparent 70%), radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 1.3px); background-size: auto, 26px 26px; }
  .wrap { width: min(980px, 100%); }
  .hd { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 28px; } .hd h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); letter-spacing: -.04em; line-height: 1; } .hd h1 em { font-style: normal; color: var(--accent); } .hd p { font: 400 12px var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .cell { position: relative; min-height: 190px; border-radius: 24px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01)); display: grid; place-items: center; }
  .cell small { position: absolute; left: 18px; top: 16px; font: 500 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .mag { position: relative; display: inline-block; will-change: transform; } .mag > button, .mag > a { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 12px; font: 600 16px var(--sans); position: relative; overflow: hidden; isolation: isolate; }
  .mag .in { display: inline-flex; align-items: center; gap: 12px; will-change: transform; position: relative; z-index: 1; }
  .b1 { padding: 20px 34px; border-radius: 99px; background: var(--accent); color: var(--ink); }
  .b1::before { content: ''; position: absolute; inset: 0; background: #fff; border-radius: inherit; transform: translateY(101%); transition: transform .6s var(--ease); z-index: 0; } .mag:hover .b1::before { transform: none; }
  .b2 { padding: 19px 33px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.3); transition: border-color .4s, color .4s; } .b2::before { content: ''; position: absolute; left: 50%; top: 50%; width: 0; height: 0; border-radius: 50%; background: var(--fg); transform: translate(-50%, -50%); transition: width .7s var(--ease), height .7s var(--ease); z-index: 0; } .mag:hover .b2 { color: var(--bg); border-color: var(--fg); } .mag:hover .b2::before { width: 260px; height: 260px; }
  .b3 { padding: 8px 26px 8px 8px; border-radius: 99px; background: rgba(255,255,255,.07); border: 1px solid var(--line); } .b3 .ic { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: var(--ink); display: grid; place-items: center; transition: transform .7s var(--ease); } .mag:hover .b3 .ic { transform: scale(1.12) rotate(90deg); } .b3 .ic svg { width: 16px; height: 16px; margin-left: 2px; }
  .b4 { padding: 20px 34px; border-radius: 16px; background: linear-gradient(135deg, #7b5cff, #ff5cb1); color: #fff; } .b4::after { content: ''; position: absolute; top: 0; bottom: 0; width: 60px; left: -80px; background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-20deg); z-index: 2; } .mag:hover .b4::after { left: 120%; transition: left .9s var(--ease); }
  .b5 { padding: 20px 34px; border-radius: 18px; background: #fff; color: #111; } .rip { position: absolute; border-radius: 50%; background: rgba(215,255,95,.7); transform: scale(0); animation: rp .8s var(--ease) forwards; pointer-events: none; z-index: 0; } @keyframes rp { to { transform: scale(1); opacity: 0; } }
  .b6 { padding: 20px 32px; border-radius: 99px; border: 1.5px solid rgba(255,92,108,.5); color: var(--danger); user-select: none; } .b6::before { content: ''; position: absolute; inset: 0; background: var(--danger); transform: scaleX(var(--h, 0)); transform-origin: left; z-index: 0; } .b6.on { color: #fff; } .b6.done { background: var(--danger); color: #fff; }
  .arrow { display: inline-block; transition: transform .5s var(--ease); } .mag:hover .arrow { transform: translateX(6px); }
  .foot { text-align: center; margin-top: 28px; font: 400 12px var(--mono); color: var(--muted); letter-spacing: .08em; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr 1fr; } } @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><h1>Magnetic <em>buttons.</em></h1><p>Move close — don't touch</p></div>
  <div class="grid">
    <div class="cell"><small>01 · Fill</small><div class="mag"><button class="b1"><span class="in">Get started <span class="arrow">→</span></span></button></div></div>
    <div class="cell"><small>02 · Radial</small><div class="mag"><button class="b2"><span class="in">View the work</span></button></div></div>
    <div class="cell"><small>03 · Icon</small><div class="mag"><button class="b3"><span class="in"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg></span>Play reel</span></button></div></div>
    <div class="cell"><small>04 · Sheen</small><div class="mag"><button class="b4"><span class="in">✦ Upgrade to Pro</span></button></div></div>
    <div class="cell"><small>05 · Ripple</small><div class="mag"><button class="b5" id="rip"><span class="in">Click anywhere on me</span></button></div></div>
    <div class="cell"><small>06 · Hold</small><div class="mag"><button class="b6" id="hold"><span class="in" id="holdL">Hold to delete</span></button></div></div>
  </div>
  <p class="foot">Each button is pulled by a spring toward your cursor — inner label moves further for depth.</p>
</div>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const items = [...document.querySelectorAll('.mag')].map((el) => ({ el, inner: el.querySelector('.in'), x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0 }));
  addEventListener('pointermove', (e) => {
    items.forEach((m) => {
      const r = m.el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, dx = e.clientX - cx, dy = e.clientY - cy, d = Math.hypot(dx, dy), reach = Math.max(r.width, r.height) * .9;
      if (!reduce && d < reach) { const p = 1 - d / reach; m.tx = dx * .38 * (.4 + p); m.ty = dy * .38 * (.4 + p); } else { m.tx = 0; m.ty = 0; }
    });
  });
  document.addEventListener('pointerleave', () => items.forEach((m) => (m.tx = m.ty = 0)));
  (function loop() {
    items.forEach((m) => {
      m.vx += (m.tx - m.x) * .16; m.vy += (m.ty - m.y) * .16; m.vx *= .72; m.vy *= .72; m.x += m.vx; m.y += m.vy;
      m.el.style.transform = `translate3d(${m.x}px, ${m.y}px, 0)`; m.inner.style.transform = `translate3d(${m.x * .35}px, ${m.y * .35}px, 0)`;
    });
    requestAnimationFrame(loop);
  })();
  const rip = document.getElementById('rip');
  rip.addEventListener('pointerdown', (e) => { const r = rip.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2.2, o = document.createElement('span'); o.className = 'rip'; o.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`; rip.appendChild(o); setTimeout(() => o.remove(), 900); });
  const hold = document.getElementById('hold'), L = document.getElementById('holdL'); let raf, t0, done = false;
  const step = (t) => { const k = Math.min(1, (t - t0) / 900); hold.style.setProperty('--h', k); if (k >= 1) { done = true; hold.classList.add('done'); L.textContent = '✓ Deleted (just kidding)'; setTimeout(() => { done = false; hold.classList.remove('done', 'on'); hold.style.setProperty('--h', 0); L.textContent = 'Hold to delete'; }, 1600); return; } raf = requestAnimationFrame(step); };
  const start = (e) => { if (done) return; e.preventDefault(); t0 = performance.now(); hold.classList.add('on'); L.textContent = 'Keep holding…'; raf = requestAnimationFrame(step); };
  const stop = () => { if (done) return; cancelAnimationFrame(raf); hold.classList.remove('on'); hold.style.setProperty('--h', 0); L.textContent = 'Hold to delete'; };
  hold.addEventListener('pointerdown', start); ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => hold.addEventListener(ev, stop));
  hold.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') start(e); }); hold.addEventListener('keyup', stop);
})();
</script>
</body>
</html>
