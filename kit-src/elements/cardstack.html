<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Card stack — swipe deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ── tweak me ─────────────────────────────── */
  :root { --bg: #0e0a17; --fg: #f6f1ff; --muted: #9a90b3; --like: #7dffb8; --nope: #ff7a93; --sans: 'Bricolage Grotesque', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; display: grid; place-items: center; overflow: hidden; user-select: none; -webkit-user-select: none;
    background-image: radial-gradient(60% 50% at 50% 100%, rgba(165,100,255,.25), transparent 70%), radial-gradient(40% 40% at 10% 0%, rgba(255,120,170,.12), transparent 70%); }
  .wrap { width: min(380px, 92vw); text-align: center; }
  .eyebrow { font: 500 11px var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--muted); } h1 { font: 800 34px/1 var(--sans); letter-spacing: -.04em; margin: 8px 0 26px; }
  .deck { position: relative; height: min(520px, 62vh); perspective: 1200px; }
  .card { position: absolute; inset: 0; border-radius: 30px; padding: 22px; display: flex; flex-direction: column; justify-content: flex-end; text-align: left; overflow: hidden; touch-action: none; cursor: grab; will-change: transform; box-shadow: 0 40px 80px -30px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.25); transform-origin: 50% 110%; }
  .card:active { cursor: grabbing; }
  .card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 38%, rgba(0,0,0,.72)); } .card > * { position: relative; }
  .art { position: absolute !important; inset: 0; } .art i { position: absolute; border-radius: 50%; filter: blur(2px); }
  .tag { align-self: flex-start; font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; padding: 6px 12px; border-radius: 99px; background: rgba(255,255,255,.18); backdrop-filter: blur(10px); margin-bottom: 12px; }
  .card h2 { font: 800 34px/.98 var(--sans); letter-spacing: -.04em; } .card p { margin-top: 8px; font-size: 14.5px; color: rgba(255,255,255,.78); line-height: 1.4; }
  .st { position: absolute !important; top: 26px; padding: 6px 16px; border: 3px solid; border-radius: 12px; font: 800 26px var(--sans); letter-spacing: .06em; opacity: 0; } .st.l { left: 24px; color: var(--like); transform: rotate(-12deg); } .st.n { right: 24px; color: var(--nope); transform: rotate(12deg); }
  .acts { display: flex; justify-content: center; gap: 18px; margin-top: 26px; }
  .b { width: 62px; height: 62px; border-radius: 50%; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); backdrop-filter: blur(10px); cursor: pointer; display: grid; place-items: center; transition: transform .5s cubic-bezier(.3,1.5,.5,1), background .3s, box-shadow .4s; color: var(--fg); }
  .b svg { width: 26px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; } .b:hover { transform: translateY(-4px) scale(1.08); } .b:active { transform: scale(.9); }
  .b.n { color: var(--nope); } .b.n:hover { background: var(--nope); color: #2a0610; box-shadow: 0 10px 34px -6px var(--nope); } .b.l { color: var(--like); } .b.l:hover { background: var(--like); color: #052a16; box-shadow: 0 10px 34px -6px var(--like); } .b.u { width: 48px; height: 48px; align-self: center; color: var(--muted); }
  .count { margin-top: 18px; font: 500 12px var(--mono); color: var(--muted); letter-spacing: .1em; }
  .done { position: absolute; inset: 0; display: none; place-content: center; text-align: center; gap: 14px; } .done h2 { font: 800 30px var(--sans); letter-spacing: -.04em; } .done p { color: var(--muted); } .done button { margin-top: 10px; height: 46px; padding: 0 26px; border-radius: 99px; border: 0; background: var(--fg); color: var(--bg); font: 600 14px var(--sans); cursor: pointer; }
  .saved { margin-top: 6px; font: 12.5px var(--mono); color: var(--like); }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Weekend escapes</div><h1>Where to next?</h1>
  <div class="deck" id="deck"><div class="done" id="done"><h2>That's the deck.</h2><p id="sum"></p><div><button id="again">Shuffle again</button></div></div></div>
  <div class="acts"><button class="b n" id="no" aria-label="Pass"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><button class="b u" id="undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button><button class="b l" id="yes" aria-label="Save"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.600-7 10-7 10z"/></svg></button></div>
  <div class="count" id="count">Drag a card · or use ← →</div>
</div>
<script>
(() => {
  const D = [
    ['Faroe Islands', 'Grass-roofed villages and waterfalls that fall into the sea.', 'Nature', ['#1f6f8b', '#99d98c', '#d9ed92']],
    ['Kyoto, in autumn', 'Temple gardens burning red; quiet mornings before the crowds.', 'Culture', ['#b5179e', '#f72585', '#ffbe0b']],
    ['Lofoten', 'Fishing huts, midnight sun and mountains straight out of the sea.', 'Adventure', ['#3a0ca3', '#4895ef', '#80ffdb']],
    ['Marrakech', 'Souks, rooftop dinners and a riad with a courtyard pool.', 'City', ['#9d0208', '#e85d04', '#ffba08']],
    ['Azores', 'Crater lakes, hot springs and whales off every headland.', 'Nature', ['#006466', '#0b525b', '#5eead4']],
    ['Amalfi Coast', 'Lemon terraces, cliffside paths and very slow lunches.', 'Coast', ['#ff6b6b', '#ffd93d', '#6bcB77']],
  ];
  const deck = document.getElementById('deck'); let order, saved, hist;
  const art = (c) => `<div class="art" style="background:linear-gradient(160deg,${c[0]},${c[1]})"><i style="width:240px;height:240px;right:-60px;top:-40px;background:${c[2]};opacity:.55"></i><i style="width:150px;height:150px;left:-30px;top:150px;background:${c[1]};opacity:.7;filter:blur(18px)"></i><i style="width:90px;height:90px;left:44%;top:30%;background:#fff;opacity:.22;filter:blur(26px)"></i></div>`;
  function build() {
    deck.querySelectorAll('.card').forEach((c) => c.remove()); order = D.map((_, i) => i).sort(() => Math.random() - .5); saved = []; hist = [];
    document.getElementById('done').style.display = 'none'; order.slice().reverse().forEach(mk); layout(); count();
  }
  function mk(i) {
    const d = D[i], el = document.createElement('div'); el.className = 'card'; el.dataset.i = i;
    el.innerHTML = `${art(d[3])}<span class="st l">SAVE</span><span class="st n">PASS</span><span class="tag">${d[2]}</span><h2>${d[0]}</h2><p>${d[1]}</p>`; deck.appendChild(el); bind(el);
  }
  const cards = () => [...deck.querySelectorAll('.card:not(.out)')];
  function layout() {
    const cs = cards(); const top = cs[cs.length - 1];
    cs.slice().reverse().forEach((c, k) => { if (c === top && c.dataset.drag) return; c.style.transition = 'transform .7s cubic-bezier(.16,1,.3,1)'; c.style.transform = `translateY(${k * 16}px) scale(${1 - k * .055}) rotateX(${k ? -2 : 0}deg)`; c.style.opacity = k > 3 ? 0 : 1; c.style.filter = k ? `brightness(${1 - k * .16})` : 'none'; c.style.zIndex = 20 - k; });
  }
  const count = () => document.getElementById('count').textContent = cards().length ? `${cards().length} left · ← pass · → save` : '';
  function fling(el, dir, vx = 0) {
    el.classList.add('out'); el.style.transition = 'transform .7s cubic-bezier(.2,.8,.2,1), opacity .7s'; el.style.transform = `translate(${dir * (innerWidth * .9)}px, -60px) rotate(${dir * 34}deg)`; el.style.opacity = 0;
    hist.push({ el, dir }); if (dir > 0) saved.push(D[el.dataset.i][0]); setTimeout(() => { if (el.classList.contains('out')) el.style.display = 'none'; }, 720);
    layout(); count(); if (!cards().length) setTimeout(finish, 450);
  }
  function finish() { const d = document.getElementById('done'); d.style.display = 'grid'; document.getElementById('sum').innerHTML = saved.length ? `You saved ${saved.length}:<div class="saved">${saved.join(' · ')}</div>` : 'You passed on everything. Tough crowd.'; }
  function bind(el) {
    let sx = 0, sy = 0, dx = 0, on = false;
    el.addEventListener('pointerdown', (e) => { if (el !== cards().pop()) return; on = true; sx = e.clientX; sy = e.clientY; el.setPointerCapture(e.pointerId); el.dataset.drag = 1; el.style.transition = 'none'; });
    el.addEventListener('pointermove', (e) => { if (!on) return; dx = e.clientX - sx; const dy = (e.clientY - sy) * .4; el.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 14}deg)`;
      el.querySelector('.st.l').style.opacity = Math.max(0, Math.min(1, dx / 110)); el.querySelector('.st.n').style.opacity = Math.max(0, Math.min(1, -dx / 110)); });
    const end = () => { if (!on) return; on = false; delete el.dataset.drag; if (Math.abs(dx) > 110) fling(el, Math.sign(dx)); else { el.querySelectorAll('.st').forEach((s) => s.style.opacity = 0); layout(); } dx = 0; };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  }
  const top = () => cards().pop();
  const act = (d) => { const t = top(); if (t) { t.querySelector(d > 0 ? '.st.l' : '.st.n').style.opacity = 1; fling(t, d); } };
  document.getElementById('yes').onclick = () => act(1); document.getElementById('no').onclick = () => act(-1);
  document.getElementById('undo').onclick = () => { const h = hist.pop(); if (!h) return; if (h.dir > 0) saved.pop(); const el = h.el; el.classList.remove('out'); el.style.display = ''; el.querySelectorAll('.st').forEach((s) => s.style.opacity = 0); document.getElementById('done').style.display = 'none'; deck.appendChild(el); el.style.transition = 'none'; el.style.transform = `translate(${h.dir * 400}px,-40px) rotate(${h.dir * 24}deg)`; el.style.opacity = 0; requestAnimationFrame(() => { layout(); }); count(); };
  document.getElementById('again').onclick = build;
  addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') act(1); if (e.key === 'ArrowLeft') act(-1); if (e.key === 'z') document.getElementById('undo').click(); });
  build();
})();
</script>
</body>
</html>
