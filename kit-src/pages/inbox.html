<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inbox — Postmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  /* ── tweak me ─────────────────────────────── */
  :root { --bg: #eceef2; --panel: #ffffff; --soft: #f5f6f9; --fg: #14161c; --muted: #6c7282; --line: #e3e6ec; --accent: #0b8ea8; --accent-soft: #dff3f7; --star: #f2a900;
    --sans: 'Geist', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace; --serif: 'Newsreader', Georgia, serif; --ease: cubic-bezier(.16,1,.3,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; padding: 14px; overflow: hidden; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .app { height: 100%; display: grid; grid-template-columns: 220px 340px 1fr; gap: 12px; }
  .pane { background: var(--panel); border-radius: 22px; border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .side { padding: 18px 12px; background: #11141a; color: #e9ecf2; border-color: #11141a; }
  .logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font: 600 16px var(--sans); letter-spacing: -.02em; }
  .logo i { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, #2fd0ee, #0b8ea8); display: grid; place-items: center; font-style: normal; font-size: 12px; color: #fff; }
  .compose { margin: 0 4px 16px; height: 42px; border-radius: 13px; background: #fff; color: #11141a; font-weight: 600; font-size: 14px; transition: .4s var(--ease); } .compose:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -10px #2fd0ee; }
  .nav button { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 12px; font-size: 14px; color: #a2a9b8; transition: .25s; } .nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav button.on { background: rgba(47,208,238,.14); color: #fff; } .nav b { font: 500 11px var(--mono); color: #6f7787; } .nav .on b { color: #5fe0f5; }
  .labels { margin-top: 22px; padding: 0 12px; font: 500 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: #5d6575; } .lab { display: flex; align-items: center; gap: 10px; padding: 9px 12px; font-size: 13.5px; color: #a2a9b8; } .lab i { width: 8px; height: 8px; border-radius: 50%; }
  .keys { margin-top: auto; padding: 12px; font: 11px/1.9 var(--mono); color: #5d6575; border-top: 1px solid #202530; } kbd { font: inherit; padding: 1px 6px; border-radius: 5px; background: #1c212b; color: #b9c0cf; }
  .list-h { padding: 16px 16px 10px; } .list-h h2 { font: 600 20px var(--sans); letter-spacing: -.03em; display: flex; justify-content: space-between; align-items: baseline; } .list-h h2 small { font: 12px var(--mono); color: var(--muted); }
  .search { margin-top: 12px; position: relative; } .search input { width: 100%; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); padding: 0 14px 0 38px; font: 14px var(--sans); outline: none; transition: .25s; } .search input:focus { border-color: var(--accent); background: #fff; } .search svg { position: absolute; left: 12px; top: 11px; width: 17px; color: var(--muted); }
  .items { overflow: auto; flex: 1; padding: 0 8px 8px; scrollbar-width: thin; }
  .it { position: relative; width: 100%; text-align: left; display: grid; grid-template-columns: 38px 1fr auto; gap: 12px; padding: 13px 10px; border-radius: 15px; transition: background .2s, transform .45s var(--ease), opacity .45s, max-height .45s var(--ease); max-height: 110px; align-items: start; }
  .it:hover { background: var(--soft); } .it.on { background: var(--accent-soft); }
  .it.gone { opacity: 0; transform: translateX(-30px); max-height: 0; padding-block: 0; overflow: hidden; }
  .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--sans); color: #fff; }
  .it .t { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; } .it .nm { font-weight: 500; } .it.unread .nm { font-weight: 600; } .it.unread .nm::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 7px; }
  .it .s { font-size: 13.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; } .it.unread .s { font-weight: 600; } .it .p { font-size: 12.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .it time { font: 11.5px var(--mono); color: var(--muted); white-space: nowrap; } .star { color: #c5cad6; font-size: 15px; line-height: 1; text-align: right; margin-top: 8px; transition: .3s var(--ease); } .star.on { color: var(--star); transform: scale(1.2); }
  .read { overflow: auto; } .tools { display: flex; gap: 6px; padding: 14px 20px; border-bottom: 1px solid var(--line); align-items: center; position: sticky; top: 0; background: rgba(255,255,255,.9); backdrop-filter: blur(12px); z-index: 2; }
  .tb { height: 36px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--line); font-size: 13px; display: flex; align-items: center; gap: 8px; transition: .25s; } .tb:hover { background: var(--soft); border-color: #cfd4de; } .tb kbd { font: 11px var(--mono); color: var(--muted); }
  .msg { padding: 34px clamp(20px, 5vw, 56px) 60px; max-width: 760px; animation: in .6s var(--ease); } @keyframes in { from { opacity: 0; transform: translateY(14px); } }
  .msg h1 { font: 400 clamp(1.7rem, 3vw, 2.4rem)/1.1 var(--serif); letter-spacing: -.02em; }
  .meta { display: flex; align-items: center; gap: 14px; margin: 24px 0 28px; padding-bottom: 22px; border-bottom: 1px solid var(--line); } .meta .av { width: 44px; height: 44px; } .meta b { font-weight: 600; } .meta small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; } .meta time { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
  .body p { font: 400 17px/1.7 var(--serif); color: #2a2e38; margin-bottom: 16px; } .body .tag { display: inline-block; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font: 500 12px var(--mono); }
  .reply { margin-top: 30px; border: 1px solid var(--line); border-radius: 18px; padding: 14px; transition: .3s; } .reply:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); } .reply textarea { width: 100%; border: 0; outline: 0; resize: none; font: 15px/1.5 var(--sans); min-height: 64px; } .reply .r { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font: 12px var(--mono); }
  .send { height: 38px; padding: 0 20px; border-radius: 99px; background: var(--fg); color: #fff; font-weight: 600; font-size: 13.5px; transition: .4s var(--ease); } .send:hover { background: var(--accent); }
  .empty { margin: auto; text-align: center; color: var(--muted); padding: 40px; } .empty h3 { font: 400 28px var(--serif); color: var(--fg); margin-bottom: 8px; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 120px); background: #11141a; color: #fff; border-radius: 14px; padding: 12px 14px 12px 18px; font-size: 14px; display: flex; gap: 18px; align-items: center; transition: .6s var(--ease); z-index: 9; box-shadow: 0 20px 60px -20px #000; } .toast.on { transform: translate(-50%, 0); } .toast button { color: #5fe0f5; font-weight: 600; }
  @media (max-width: 980px) { .app { grid-template-columns: 76px 300px 1fr; } .side .logo span, .nav span.l, .nav b, .labels, .lab span, .keys, .compose { display: none; } .nav button { justify-content: center; } }
  @media (max-width: 700px) { body { overflow: auto; } .app { grid-template-columns: 1fr; height: auto; } .side { display: none; } .pane { max-height: 70vh; } }
</style>
</head>
<body>
<div class="app">
  <aside class="pane side">
    <div class="logo"><i>P</i><span>Postmark</span></div>
    <button class="compose" id="compose">Compose</button>
    <nav class="nav" id="nav"></nav>
    <div class="labels">Labels</div>
    <div class="lab"><i style="background:#2fd0ee"></i><span>Clients</span></div><div class="lab"><i style="background:#ff8a5c"></i><span>Invoices</span></div><div class="lab"><i style="background:#a58bff"></i><span>Travel</span></div>
    <div class="keys"><kbd>J</kbd> <kbd>K</kbd> move · <kbd>E</kbd> archive<br/><kbd>S</kbd> star · <kbd>U</kbd> unread · <kbd>/</kbd> search</div>
  </aside>
  <section class="pane">
    <div class="list-h"><h2><span id="folder">Inbox</span><small id="count"></small></h2>
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search mail" aria-label="Search mail" /></label></div>
    <div class="items" id="items"></div>
  </section>
  <section class="pane read" id="read"></section>
</div>
<div class="toast" id="toast"><span id="tmsg"></span><button id="undo">Undo</button></div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const COL = ['#0b8ea8', '#e0603b', '#7a5cf0', '#2e9e6b', '#c2477a', '#d08a10'];
  const M = [
    ['Mara Okonkwo', 'Q3 brand refresh — final round', 'Hi! The leadership team signed off on direction B. Can you send over the type specimen and the updated logo lockups by Thursday?', '9:41 AM', 1, 0, 'Clients', "Hi,\n\nGood news — the leadership team signed off on direction B this morning, with one small note: they'd like the wordmark a touch heavier.\n\nCould you send over the type specimen and the updated logo lockups by Thursday? We're presenting to the board on Friday and I'd love to have everything in one deck.\n\nThanks so much for the speed on this.\n\nMara"],
    ['Linear', 'Weekly digest: 14 issues closed', 'Your team closed 14 issues this week, 3 more than last week. Highlights: onboarding redesign shipped.', '8:15 AM', 1, 0, '', "Your team closed 14 issues this week — 3 more than the week before.\n\nHighlights: onboarding redesign shipped, billing webhook retries merged, and the long-running search bug is finally gone.\n\nKeep going."],
    ['Tomás Rivera', 'Lisbon workshop — logistics', 'Flights are booked. I put the venue map and the schedule in the shared folder; breakfast is at 8.', 'Yesterday', 1, 1, 'Travel', "Flights are booked and the hotel is confirmed.\n\nI put the venue map and the final schedule in the shared folder. Breakfast is at 8:00, we start at 9:30 sharp — Ines wants a full hour for the opening exercise.\n\nSee you there!\nTomás"],
    ['Stripe', 'Invoice #2042 was paid', 'Northwind paid invoice #2042 for $4,800.00. The funds will arrive in your bank account in 2 business days.', 'Yesterday', 0, 0, 'Invoices', "Northwind paid invoice #2042 for $4,800.00.\n\nThe funds will arrive in your bank account within 2 business days. No action is needed from you."],
    ['Priya Nair', 'Re: Illustration style options', "I love the second set — the grain gives it so much warmth. Could we try the same palette with fewer details?", 'Mon', 0, 0, 'Clients', "I love the second set — the grain gives it so much warmth.\n\nCould we try the same palette with fewer details? I think the hero needs more breathing room, and the small ones can stay as they are.\n\nPriya"],
    ['Figma', 'Jonas commented on “Homepage v7”', '“Can we try this section with a quieter background? The headline is fighting the image.”', 'Mon', 0, 0, '', "Jonas left a comment on Homepage v7:\n\n“Can we try this section with a quieter background? The headline is fighting the image.”\n\nOpen in Figma to reply."],
    ['Aurora Air', 'Your boarding pass · LIS → CPH', 'Check-in is open. Your seat is 14A. Gate information will appear 40 minutes before departure.', 'Sun', 0, 0, 'Travel', "Check-in is now open for AU 418, Lisbon → Copenhagen.\n\nSeat: 14A · Boarding group B · Gate information will appear 40 minutes before departure."],
    ['Dana Whitfield', 'Coffee next week?', "Been meaning to catch up properly. Are you free Tuesday or Wednesday afternoon? There's a new place by the river.", 'Sat', 0, 0, '', "Been meaning to catch up properly — it's been months!\n\nAre you free Tuesday or Wednesday afternoon? There's a new place by the river that does a ridiculous cardamom bun.\n\nDana"],
    ['Notion', 'Welcome to your new workspace', 'Here are four things to try first: templates, databases, AI summaries and shared pages.', 'Fri', 0, 0, '', "Welcome! Here are four things to try first: start from a template, build a database, summarise a long page with AI, and share a page with your team."],
  ].map((m, i) => ({ id: i, from: m[0], subj: m[1], prev: m[2], time: m[3], unread: !!m[4], star: !!m[5], label: m[6], text: m[7], folder: 'inbox', color: COL[i % COL.length] }));

  let folder = 'inbox', cur = M[0].id, query = '', last = null;
  const init = (n) => n.split(' ').map((x) => x[0]).slice(0, 2).join('');
  const inF = (m) => folder === 'starred' ? m.star && m.folder !== 'trash' : m.folder === folder;
  const vis = () => M.filter((m) => inF(m) && (!query || (m.from + m.subj + m.text).toLowerCase().includes(query)));

  function nav() {
    const c = (f) => f === 'starred' ? M.filter((m) => m.star && m.folder !== 'trash').length : M.filter((m) => m.folder === f && (f !== 'inbox' || m.unread)).length;
    $('nav').innerHTML = [['inbox', 'Inbox', 'M3 12h5l2 3h4l2-3h5M5 5h14l2 7v7H3v-7z'], ['starred', 'Starred', 'm12 3 2.8 5.9 6.2.8-4.6 4.3 1.2 6.2L12 17.2 6.4 20.2l1.2-6.2L3 9.7l6.2-.8z'], ['archive', 'Archive', 'M3 5h18v4H3zM5 9v10h14V9M10 13h4'], ['trash', 'Trash', 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13']]
      .map(([f, l, p]) => `<button data-f="${f}" class="${f === folder ? 'on' : ''}"><span style="display:flex;gap:11px;align-items:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></svg><span class="l">${l}</span></span><b>${c(f) || ''}</b></button>`).join('');
  }
  function list() {
    const v = vis();
    $('folder').textContent = folder[0].toUpperCase() + folder.slice(1); $('count').textContent = v.length + ' messages';
    $('items').innerHTML = v.length ? v.map((m) => `<button class="it ${m.unread ? 'unread' : ''} ${m.id === cur ? 'on' : ''}" data-id="${m.id}"><span class="av" style="background:${m.color}">${init(m.from)}</span><span style="min-width:0"><span class="t"><span class="nm">${m.from}</span></span><span class="s" style="display:block">${m.subj}</span><span class="p" style="display:block">${m.prev}</span></span><span><time>${m.time}</time><div class="star ${m.star ? 'on' : ''}" data-s="${m.id}">★</div></span></button>`).join('')
      : `<div class="empty"><h3>Nothing here.</h3>${query ? 'No messages match your search.' : 'Inbox zero feels good.'}</div>`;
  }
  function read() {
    const m = M[cur]; const v = vis();
    if (!m || !v.includes(m)) { $('read').innerHTML = `<div class="empty"><h3>Select a message</h3>Use <b>J</b> / <b>K</b> to move, <b>E</b> to archive.</div>`; return; }
    m.unread = false;
    $('read').innerHTML = `<div class="tools"><button class="tb" data-a="archive">Archive <kbd>E</kbd></button><button class="tb" data-a="trash">Delete <kbd>#</kbd></button><button class="tb" data-a="star">${m.star ? 'Unstar' : 'Star'} <kbd>S</kbd></button><button class="tb" data-a="unread" style="margin-left:auto">Mark unread <kbd>U</kbd></button></div>
    <article class="msg"><h1>${m.subj}</h1><div class="meta"><span class="av" style="background:${m.color}">${init(m.from)}</span><div><b>${m.from}</b><small>to me${m.label ? ' · <span class="tag" style="font-size:11px;padding:2px 8px">' + m.label + '</span>' : ''}</small></div><time>${m.time}</time></div>
    <div class="body">${m.text.split('\n\n').map((p) => `<p>${p.replace(/\n/g, '<br/>')}</p>`).join('')}</div>
    <div class="reply"><textarea placeholder="Reply to ${m.from.split(' ')[0]}…" aria-label="Reply"></textarea><div class="r"><span>⌘ Enter to send</span><button class="send" data-a="send">Send reply</button></div></div></article>`;
  }
  const all = () => { read(); nav(); list(); };
  function toast(msg, fn) { $('tmsg').textContent = msg; last = fn; $('toast').classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').classList.remove('on'), 4200); }
  function act(a) {
    const m = M[cur]; if (!m) return; const v = vis(); const i = v.indexOf(m);
    if (a === 'star') { m.star = !m.star; all(); return; }
    if (a === 'unread') { m.unread = true; nav(); list(); return; }
    if (a === 'send') { const t = document.querySelector('.reply textarea'); if (t.value.trim()) { t.value = ''; toast('Reply sent', null); } return; }
    const prevF = m.folder; const el = document.querySelector(`.it[data-id="${m.id}"]`);
    const nextM = v[i + 1] || v[i - 1];
    el && el.classList.add('gone');
    setTimeout(() => { m.folder = a === 'archive' ? 'archive' : 'trash'; cur = nextM ? nextM.id : -1; all(); }, 380);
    toast(a === 'archive' ? 'Conversation archived' : 'Moved to trash', () => { m.folder = prevF; cur = m.id; all(); });
  }
  $('nav').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; folder = b.dataset.f; const v = vis(); cur = v[0] ? v[0].id : -1; all(); };
  $('items').onclick = (e) => { const s = e.target.closest('[data-s]'); if (s) { const m = M[+s.dataset.s]; m.star = !m.star; e.stopPropagation(); all(); return; } const b = e.target.closest('.it'); if (b) { cur = +b.dataset.id; all(); } };
  $('read').onclick = (e) => { const b = e.target.closest('[data-a]'); if (b) act(b.dataset.a); };
  $('q').oninput = (e) => { query = e.target.value.trim().toLowerCase(); const v = vis(); if (!v.includes(M[cur])) cur = v[0] ? v[0].id : -1; all(); };
  $('undo').onclick = () => { if (last) last(); $('toast').classList.remove('on'); };
  $('compose').onclick = () => toast('Composer is just a demo — try replying instead', null);
  addEventListener('keydown', (e) => {
    if (e.target.matches('input,textarea')) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) act('send'); if (e.key === 'Escape') e.target.blur(); return; }
    const v = vis(); const i = v.findIndex((m) => m.id === cur);
    if (e.key === 'j' && v[i + 1]) { cur = v[i + 1].id; all(); document.querySelector('.it.on')?.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'k' && v[i - 1]) { cur = v[i - 1].id; all(); document.querySelector('.it.on')?.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'e') act('archive'); else if (e.key === '#') act('trash'); else if (e.key === 's') act('star'); else if (e.key === 'u') act('unread');
    else if (e.key === '/') { e.preventDefault(); $('q').focus(); }
  });
  all();
})();
</script>
</body>
</html>
